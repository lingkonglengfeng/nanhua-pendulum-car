<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒立摆整车 V1 — 独立三维预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#173447;font:15px system-ui,"Microsoft YaHei",sans-serif}header{padding:18px 24px;background:#fff;border-bottom:1px solid #d7e1e7}h1{font-size:23px;margin:0 0 7px}p{margin:0;color:#607786;line-height:1.6}main{max-width:1550px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:80vh}.view{position:relative;min-height:670px;background:linear-gradient(#f8fafb,#e7eef3)}canvas{display:block;width:100%;height:100%;position:absolute;touch-action:none}.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #b8cad5;background:#fff;color:#173447;padding:8px 12px;border-radius:5px;cursor:pointer}aside{padding:24px;background:white}h2{font-size:17px;margin:0 0 18px}label{display:block;margin:14px 0}select{width:100%;padding:7px;border:1px solid #b8cad5;background:white;color:#173447}input[type=range]{width:100%;accent-color:#198b9a}.hint{position:absolute;bottom:12px;left:16px;color:#607786;font-size:13px}.note{font-size:13px;line-height:1.8;color:#607786;border-top:1px solid #d7e1e7;padding-top:16px;margin-top:20px}.key{margin:13px 0;display:flex;align-items:center;gap:9px}.swatch{width:13px;height:13px;border-radius:3px}.status{font-variant-numeric:tabular-nums;line-height:1.9}@media(max-width:780px){main{display:block}.view{min-height:560px}aside{padding:20px}header{padding:16px}h1{font-size:20px}}
</style></head><body><header><h1>倒立摆小车 · 整车装配 V1</h1><p>520 四驱 · FR4 底板 · AS5600 · 可调配重 · 实际设计件与布局占位件</p></header>
<main><section class="view"><canvas id="view" aria-label="三维整车模型，拖动旋转、滚轮缩放"></canvas><div class="toolbar"><button id="front">正面</button><button id="side">侧面</button><button id="top">上方</button><button id="bottom">底部</button><button id="reset">复位</button></div><div class="hint">拖动旋转 · 滚轮缩放 · 下方可调整摆角和配重位置</div></section>
<aside><h2>查看整车</h2><label>查看范围<select id="focus"><option value="all">整车</option><option value="base">底盘与电子模块</option><option value="encoder">摆轴与 AS5600</option><option value="weight">配重夹环</option></select></label><label>摆杆角度 <strong id="angleText">0°</strong><input id="angle" type="range" min="-180" max="180" step="1" value="0"></label><label>下夹环距摆轴 <strong id="positionText">160 mm</strong><input id="weightPosition" type="range" min="70" max="230" step="5" value="160"></label><label><input id="refs" type="checkbox" checked> 显示采购件与电子模块参考</label><label><input id="wiring" type="checkbox" checked> 显示参考走线</label><label><input id="sweep" type="checkbox"> 显示摆杆扫掠圆</label><div class="key"><span class="swatch" style="background:#198b9a"></span>已设计的打印支架</div><div class="key"><span class="swatch" style="background:#9bac82"></span>FR4 主底板</div><div class="key"><span class="swatch" style="background:#cd783c"></span>摆杆夹座 / 配重</div><div class="status">底板：320 × 220 × 4 mm<br>参考总外廓：320 × 280 × 664 mm<br>摆轴距底板：320 mm<br>摆轴至杆端：280 mm<br>配重：两片垫片 + 两组夹环</div><div class="note">主控、驱动模块、轮毂、电池接头和线束尚无准确实物尺寸。本模型用于看装配与空间，不是接线图或控制仿真。<br><br>名义轴高未包含实际减速箱出轴偏置，整车高度与离地间隙需装机核对。</div></aside></main>
