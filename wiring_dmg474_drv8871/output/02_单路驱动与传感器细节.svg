<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1480" viewBox="0 0 1900 1480">
<title>DRV8871单路接线与AS5600细节</title>
<rect width="1900" height="1480" fill="white"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<text x="60" y="60" font-size="34" fill="#213547" text-anchor="start" font-weight="600">单路驱动与传感器接线细节</text>
<text x="60" y="99" font-size="21" fill="#5d7081" text-anchor="start" font-weight="400">四路电机复制同一接法；以下引脚名称是功能名，不是排针位置顺序。</text>
<text x="1840" y="65" font-size="20" fill="#5d7081" text-anchor="end" font-weight="400">02 / 02</text>
<rect x="60" y="150" width="450" height="450" rx="8" fill="#f5f8fc" stroke="#7f9db5" stroke-width="2"/>
<text x="85" y="193" font-size="25" fill="#213547" text-anchor="start" font-weight="600">主控原始 3.3V 信号</text>
<text x="85" y="236" font-size="20" fill="#a46418" text-anchor="start" font-weight="400">Px 引脚 / 端子号：待官方原理图确认</text>
<text x="485" y="317" font-size="22" fill="#2469a0" text-anchor="end" font-weight="400">PWM 输出</text>
<circle cx="510" cy="310" r="4" fill="white" stroke="#2469a0" stroke-width="2"/>
<path d="M510,310 L780,310" fill="none" stroke="#2469a0" stroke-width="3"/>
<text x="485" y="397" font-size="22" fill="#2469a0" text-anchor="end" font-weight="400">DIR 普通输出</text>
<circle cx="510" cy="390" r="4" fill="white" stroke="#2469a0" stroke-width="2"/>
<path d="M510,390 L780,390" fill="none" stroke="#2469a0" stroke-width="3"/>
<text x="85" y="465" font-size="22" fill="#213547" text-anchor="start" font-weight="400">主控与驱动共地</text>
<text x="85" y="506" font-size="20" fill="#a46418" text-anchor="start" font-weight="400">电机大电流不经过主控排针</text>
<text x="85" y="547" font-size="18" fill="#5d7081" text-anchor="start" font-weight="400">转接 PCB 可选；端子排也能完成分配</text>
<rect x="780" y="150" width="430" height="450" rx="8" fill="#fff" stroke="#7f9db5" stroke-width="2"/>
<text x="805" y="193" font-size="25" fill="#213547" text-anchor="start" font-weight="600">DRV8871 成品模块</text>
<circle cx="780" cy="240" r="4" fill="white" stroke="#c33c37" stroke-width="2"/>
<path d="M650,240 L780,240" fill="none" stroke="#c33c37" stroke-width="4"/>
<text x="645" y="232" font-size="19" fill="#c33c37" text-anchor="end" font-weight="600">VM_MOTOR</text>
<text x="805" y="248" font-size="22" fill="#c33c37" text-anchor="start" font-weight="400">POWER +  → 电机电源</text>
<circle cx="780" cy="310" r="4" fill="white" stroke="#2469a0" stroke-width="2"/>
<text x="805" y="317" font-size="24" fill="#2469a0" text-anchor="start" font-weight="400">IN1</text>
<circle cx="780" cy="390" r="4" fill="white" stroke="#2469a0" stroke-width="2"/>
<text x="805" y="397" font-size="24" fill="#2469a0" text-anchor="start" font-weight="400">IN2</text>
<circle cx="780" cy="465" r="4" fill="white" stroke="#5e6872" stroke-width="2"/>
<path d="M690,465 L780,465" fill="none" stroke="#5e6872" stroke-width="3"/>
<path d="M690,465 L690,477" fill="none" stroke="#5e6872" stroke-width="2"/>
<path d="M681.0,477 L699.0,477" fill="none" stroke="#5e6872" stroke-width="2"/>
<path d="M684.0,483 L696.0,483" fill="none" stroke="#5e6872" stroke-width="2"/>
<path d="M687.0,489 L693.0,489" fill="none" stroke="#5e6872" stroke-width="2"/>
<text x="705" y="486" font-size="17" fill="#5e6872" text-anchor="start" font-weight="400">GND</text>
<text x="805" y="472" font-size="22" fill="#5e6872" text-anchor="start" font-weight="400">POWER − / GND</text>
<text x="805" y="535" font-size="21" fill="#a46418" text-anchor="start" font-weight="400">排针 VCC：本方案不使用</text>
<text x="805" y="570" font-size="18" fill="#5d7081" text-anchor="start" font-weight="400">疑似与 POWER+ 同网，断电测通断确认</text>
<circle cx="1210" cy="310" r="4" fill="white" stroke="#213547" stroke-width="2"/>
<path d="M1210,310 L1430,310" fill="none" stroke="#213547" stroke-width="4"/>
<text x="1185" y="298" font-size="21" fill="#213547" text-anchor="end" font-weight="400">MOTOR 1</text>
<circle cx="1210" cy="390" r="4" fill="white" stroke="#213547" stroke-width="2"/>
<path d="M1210,390 L1430,390" fill="none" stroke="#213547" stroke-width="4"/>
<text x="1185" y="378" font-size="21" fill="#213547" text-anchor="end" font-weight="400">MOTOR 2</text>
<rect x="1430" y="150" width="410" height="450" rx="8" fill="#fbfcfd" stroke="#9eacb8" stroke-width="2"/>
<text x="1455" y="193" font-size="25" fill="#213547" text-anchor="start" font-weight="600">370 编码电机</text>
<text x="1455" y="251" font-size="23" fill="#213547" text-anchor="start" font-weight="600">电机绕组</text>
<circle cx="1430" cy="310" r="4" fill="white" stroke="#213547" stroke-width="2"/>
<circle cx="1430" cy="390" r="4" fill="white" stroke="#213547" stroke-width="2"/>
<text x="1455" y="317" font-size="22" fill="#213547" text-anchor="start" font-weight="400">电机线 A</text>
<text x="1455" y="397" font-size="22" fill="#213547" text-anchor="start" font-weight="400">电机线 B</text>
<text x="1455" y="466" font-size="21" fill="#213547" text-anchor="start" font-weight="600">编码器供电与反馈：</text>
<text x="1455" y="505" font-size="20" fill="#298456" text-anchor="start" font-weight="400">E+ = 3.3V；E− = GND</text>
<text x="1455" y="543" font-size="18" fill="#8552a1" text-anchor="start" font-weight="400">A / B → 对应轮子的 ENC_A / ENC_B</text>
<text x="1455" y="579" font-size="18" fill="#a46418" text-anchor="start" font-weight="400">不要把电机电源接到编码器电源脚</text>
<rect x="60" y="640" width="800" height="320" rx="8" fill="#fff" stroke="#b9c7d0" stroke-width="2"/>
<text x="85" y="680" font-size="24" fill="#213547" text-anchor="start" font-weight="600">输入逻辑（TI 数据手册）</text>
<text x="100" y="724" font-size="20" fill="#213547" text-anchor="start" font-weight="600">IN1</text>
<text x="200" y="724" font-size="20" fill="#213547" text-anchor="start" font-weight="600">IN2</text>
<text x="305" y="724" font-size="20" fill="#213547" text-anchor="start" font-weight="600">桥输出状态</text>
<text x="100" y="767" font-size="20" fill="#213547" text-anchor="start" font-weight="400">0</text>
<text x="200" y="767" font-size="20" fill="#213547" text-anchor="start" font-weight="400">0</text>
<text x="305" y="767" font-size="20" fill="#213547" text-anchor="start" font-weight="400">高阻滑行；持续约 1 ms 后休眠</text>
<text x="100" y="810" font-size="20" fill="#213547" text-anchor="start" font-weight="400">1</text>
<text x="200" y="810" font-size="20" fill="#213547" text-anchor="start" font-weight="400">0</text>
<text x="305" y="810" font-size="20" fill="#213547" text-anchor="start" font-weight="400">一个方向驱动</text>
<text x="100" y="853" font-size="20" fill="#213547" text-anchor="start" font-weight="400">0</text>
<text x="200" y="853" font-size="20" fill="#213547" text-anchor="start" font-weight="400">1</text>
<text x="305" y="853" font-size="20" fill="#213547" text-anchor="start" font-weight="400">相反方向驱动</text>
<text x="100" y="896" font-size="20" fill="#213547" text-anchor="start" font-weight="400">1</text>
<text x="200" y="896" font-size="20" fill="#213547" text-anchor="start" font-weight="400">1</text>
<text x="305" y="896" font-size="20" fill="#213547" text-anchor="start" font-weight="400">两输出拉低，制动</text>
<rect x="900" y="640" width="940" height="320" rx="8" fill="#fffaf1" stroke="#cfad79" stroke-width="2"/>
<text x="925" y="680" font-size="24" fill="#213547" text-anchor="start" font-weight="600">本图用 1 路 PWM + 1 路 GPIO 控制每个电机</text>
<text x="925" y="725" font-size="20" fill="#213547" text-anchor="start" font-weight="400">正向：IN1 = PWM(d)，IN2 = 0。</text>
<text x="925" y="768" font-size="20" fill="#213547" text-anchor="start" font-weight="400">反向：IN1 = PWM(1−d)，IN2 = 1。</text>
<text x="925" y="811" font-size="20" fill="#213547" text-anchor="start" font-weight="400">停止：统一令 IN1 = 0、IN2 = 0；需要制动时另行明确选择。</text>
<text x="925" y="854" font-size="20" fill="#213547" text-anchor="start" font-weight="400">d 是驱动占空比，不等于实际转速百分比。</text>
<text x="925" y="897" font-size="20" fill="#a46418" text-anchor="start" font-weight="400">此方式正反衰减模式不同；换向需限斜率，限流按模块实装阻值核对。</text>
<text x="60" y="1020" font-size="26" fill="#213547" text-anchor="start" font-weight="600">AS5600 / 可选 IMU：I²C 接线</text>
<rect x="60" y="1080" width="390" height="230" rx="8" fill="#f5f8fc" stroke="#7f9db5" stroke-width="2"/>
<text x="85" y="1118" font-size="23" fill="#213547" text-anchor="start" font-weight="600">主控 I²C（脚号待定）</text>
<circle cx="450" cy="1170" r="4" fill="white" stroke="#2469a0" stroke-width="2"/>
<circle cx="450" cy="1230" r="4" fill="white" stroke="#2469a0" stroke-width="2"/>
<text x="425" y="1177" font-size="22" fill="#2469a0" text-anchor="end" font-weight="400">SDA</text>
<text x="425" y="1237" font-size="22" fill="#2469a0" text-anchor="end" font-weight="400">SCL</text>
<path d="M450,1170 L1280,1170" fill="none" stroke="#2469a0" stroke-width="3"/>
<path d="M450,1230 L1280,1230" fill="none" stroke="#2469a0" stroke-width="3"/>
<path d="M690,1080 L920,1080" fill="none" stroke="#298456" stroke-width="3"/>
<text x="805" y="1063" font-size="19" fill="#298456" text-anchor="middle" font-weight="600">3V3_SENS</text>
<path d="M720,1080 L720,1097" fill="none" stroke="#298456" stroke-width="3"/>
<rect x="710" y="1097" width="20" height="42" rx="0" fill="#fff" stroke="#298456" stroke-width="2"/>
<path d="M720,1139 L720,1170" fill="none" stroke="#298456" stroke-width="3"/>
<circle cx="720" cy="1170" r="4" fill="#2469a0"/>
<text x="742" y="1120" font-size="18" fill="#298456" text-anchor="start" font-weight="400">4.7kΩ *</text>
<path d="M890,1080 L890,1097" fill="none" stroke="#298456" stroke-width="3"/>
<rect x="880" y="1097" width="20" height="42" rx="0" fill="#fff" stroke="#298456" stroke-width="2"/>
<path d="M890,1139 V1163 Q903,1170 890,1177 V1230" fill="none" stroke="#298456" stroke-width="3"/>
<circle cx="890" cy="1230" r="4" fill="#2469a0"/>
<text x="912" y="1120" font-size="18" fill="#298456" text-anchor="start" font-weight="400">4.7kΩ *</text>
<rect x="1280" y="1060" width="560" height="300" rx="8" fill="#f4f8fc" stroke="#97b5cc" stroke-width="2"/>
<text x="1305" y="1102" font-size="24" fill="#213547" text-anchor="start" font-weight="600">AS5600 模块 / 逻辑功能端</text>
<circle cx="1280" cy="1170" r="4" fill="white" stroke="#2469a0" stroke-width="2"/>
<text x="1305" y="1177" font-size="23" fill="#2469a0" text-anchor="start" font-weight="400">SDA</text>
<circle cx="1280" cy="1230" r="4" fill="white" stroke="#2469a0" stroke-width="2"/>
<text x="1305" y="1237" font-size="23" fill="#2469a0" text-anchor="start" font-weight="400">SCL</text>
<text x="1510" y="1153" font-size="20" fill="#298456" text-anchor="start" font-weight="400">VCC → 3V3_SENS **</text>
<text x="1510" y="1190" font-size="20" fill="#5e6872" text-anchor="start" font-weight="400">GND → GND</text>
<text x="1305" y="1288" font-size="18" fill="#5d7081" text-anchor="start" font-weight="400">I²C 地址 0x36；与可选 IMU 同总线时核对地址冲突。</text>
<text x="1305" y="1325" font-size="19" fill="#a46418" text-anchor="start" font-weight="400">GH 插头的实际四针顺序由卖家接线图确认。</text>
<text x="60" y="1360" font-size="19" fill="#5d7081" text-anchor="start" font-weight="400">* 已有上拉时先核对阻值及上拉电压，避免重复添加；总线上拉到 3.3V。</text>
<text x="60" y="1400" font-size="19" fill="#a46418" text-anchor="start" font-weight="400">** 模块电路须允许 3.3V 供电；若只能 5V，需另设计供电/电平处理，不能照本图直接接。</text>
<text x="60" y="1440" font-size="19" fill="#5d7081" text-anchor="start" font-weight="400">模块内的限流、电容及针序因厂家而异；芯片功能已查证，具体小板布线仍以实物/原理图为准。</text>
</svg>